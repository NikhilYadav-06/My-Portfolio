<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>




</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f9;
    }

    header {
        background: #6f82b7;
        color: white;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    h1 {
        margin: 0;
    }

    button {
        padding: 10px 15px;
        border: 0;
        border-radius: 5px;
        cursor: pointer;
    }

    .logout {
        background: white;
        color: #6f82b7;
    }

    .delete {
        background: #e74c3c;
        color: white;
    }

    .container {
        padding: 30px;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 10px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th,
    td {
        padding: 12px;
        border: 1px solid #ddd;
        text-align: left;
    }

    th {
        background: #6f82b7;
        color: white;
    }

    .stat {
        display: flex;
        justify-content: center;
        margin: 30px 0;
    }

    .stat-card {
        text-align: center;
        padding: 1px 36px;
    }

    .stat-card h3 {
        margin-bottom: 10px;
    }

    .stat-card p {
        font-size: 30px;
        font-weight: 30px;
        margin: 0;
    }
</style>

<body>

    <header>
        <h1>Admin Dashboard</h1>
        <button class="logout" onclick="logout()">Logout</button>
    </header>

    <div class="stats">

        <div class="stat-card">
            <h3>Total Messages</h3>
            <p id="messageCount">0</p>
        </div>
    </div>

    <div class="container">

        <div class="card">

            <h2>Contact Messages</h2>

            <p id="status">Loading...</p>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Message</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="contactTable"></tbody>
            </table>

        </div>

    </div>

    <script>
        const API = "http://127.0.0.1:5000/api/contact";

        const token = localStorage.getItem("adminToken");

        if (!token) {
            alert("Please login first");
            window.location.href = "./AdminLogin.html";
        }
        // Load Messages
        async function loadMessages() {

            try {
                const response = await fetch(API, {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });
                const data = await response.json();

                console.log("Token:", token);
                console.log("Status:", response.status);
                console.log("Response:", data);

                const table = document.getElementById("contactTable");
                const status = document.getElementById("status");

                table.innerHTML = "";

                if (!data.success) {
                    status.innerText = "Messages Are Not Loaded";
                    return;
                }

                status.innerText = "Messages loaded successfully ";
                document.getElementById("messageCount").innerText =
                    data.contacts.length;

                data.contacts.forEach(contact => {

                    table.innerHTML += `
                <tr>
                    <td>${contact.name}</td>
                    <td>${contact.email}</td>
                    <td>${contact.message}</td>
                    <td>${new Date(contact.createdAt).toLocaleString()}</td>
                    <td>
                        <button class="delete"
                            onclick="deleteMessage('${contact._id}')">
                            Delete
                        </button>
                    </td>
                </tr>
            `;

                });

            } catch (error) {

                console.error(error);

                document.getElementById("status").innerText =
                    "Not Connect by Server";
            }
        }


        // Delete Message
        async function deleteMessage(id) {

            if (!confirm("You want delete this msg ?")) {
                return;
            }

            try {

                const response = await fetch(`${API}/${id}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (data.success) {

                    alert("Message deleted successfully ");

                    loadMessages();

                } else {

                    alert(data.message);

                }

            } catch (error) {

                console.error(error);

                alert("Message NOT DELETE ");
            }
        }


        // Logout
        function logout() {

            localStorage.removeItem("adminToken");

            window.location.href = "AdminLogin.html";
        }


        // Start
        loadMessages();

    </script>

</body>

</html>
