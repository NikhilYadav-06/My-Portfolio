<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #6f82b7;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
        }

        button {
            padding: 10px 15px;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
        }

        .logout {
            background: white;
            color: #6f82b7;
        }

        .delete {
            background: #e74c3c;
            color: white;
            margin-right: 5px;
        }

        .reply-btn {
            background: #238636;
            color: white;
        }

        .reply-btn:hover {
            background: #2ea043;
        }

        .container {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            min-width: 800px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #6f82b7;
            color: white;
        }

        .stats {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        .stat-card {
            text-align: center;
            padding: 10px 36px;
        }

        .stat-card h3 {
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 30px;
            font-weight: bold;
            margin: 0;
        }

        /* Reply status */
        .replied {
            color: green;
            font-weight: bold;
        }

        .not-replied {
            color: #e67e22;
            font-weight: bold;
        }

        /* =========================
           REPLY MODAL
        ========================= */

        .reply-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .reply-box {
            background: white;
            width: 100%;
            max-width: 550px;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .reply-box h2 {
            margin-top: 0;
            color: #333;
        }

        .reply-box label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        .reply-box input,
        .reply-box textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        .reply-box textarea {
            min-height: 160px;
            resize: vertical;
        }

        .reply-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .send-reply {
            background: #238636;
            color: white;
            flex: 1;
        }

        .cancel-reply {
            background: #777;
            color: white;
        }

        .send-reply:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #replyStatus {
            margin-top: 12px;
            font-weight: bold;
        }

        @media (max-width: 768px) {

            header {
                padding: 15px;
            }

            header h1 {
                font-size: 22px;
            }

            .container {
                padding: 15px;
            }

            .card {
                padding: 15px;
            }

            .reply-box {
                padding: 20px;
            }

            .reply-actions {
                flex-direction: column;
            }
        }
    </style>

</head>

<body>

    <header>
        <h1>Admin Dashboard</h1>

        <button class="logout" onclick="logout()">
            Logout
        </button>
    </header>


    <!-- Statistics -->

    <div class="stats">

        <div class="stat-card">

            <h3>Total Messages</h3>

            <p id="messageCount">
                0
            </p>

        </div>

    </div>


    <!-- Messages -->

    <div class="container">

        <div class="card">

            <h2>Contact Messages</h2>

            <p id="status">
                Loading...
            </p>

            <table>

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Message</th>
                        <th>Date</th>
                        <th>Reply Status</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="contactTable"></tbody>

            </table>

        </div>

    </div>


    <!-- =========================
         REPLY MODAL
    ========================= -->

    <div class="reply-modal" id="replyModal">

        <div class="reply-box">

            <h2>Reply to Message</h2>

            <label>
                To
            </label>

            <input type="email" id="replyEmail" readonly>


            <label>
                Reply
            </label>

            <textarea id="replyText" placeholder="Write your reply here..."></textarea>


            <p id="replyStatus"></p>


            <div class="reply-actions">

                <button class="send-reply" id="sendReplyBtn" onclick="sendReply()">
                    Send Reply
                </button>

                <button class="cancel-reply" onclick="closeReply()">
                    Cancel
                </button>

            </div>

        </div>

    </div>


    <script>

        const API =
            "https://my-portfolio-edwk.onrender.com/api/contact";


        const token =
            localStorage.getItem("adminToken");


        let selectedContactId = null;


        // =========================
        // AUTH CHECK
        // =========================

        if (!token) {

            alert("Please login first");

            window.location.href =
                "./AdminLogin.html";
        }


        // =========================
        // LOAD MESSAGES
        // =========================

        async function loadMessages() {

            try {

                const response = await fetch(API, {

                    headers: {
                        "Authorization": `Bearer ${token}`
                    }

                });


                const data =
                    await response.json();


                console.log("Messages:", data);


                const table =
                    document.getElementById(
                        "contactTable"
                    );


                const status =
                    document.getElementById(
                        "status"
                    );


                table.innerHTML = "";


                if (!response.ok || !data.success) {

                    status.innerText =
                        data.message ||
                        "Messages are not loaded";

                    return;
                }


                status.innerText =
                    "Messages loaded successfully";


                document.getElementById(
                    "messageCount"
                ).innerText =
                    data.contacts.length;


                data.contacts.forEach(contact => {

                    const replyStatus =
                        contact.replied
                            ? `<span class="replied">Replied</span>`
                            : `<span class="not-replied">Not Replied</span>`;


                    table.innerHTML += `

                        <tr>

                            <td>
                                ${escapeHTML(contact.name)}
                            </td>

                            <td>
                                ${escapeHTML(contact.email)}
                            </td>

                            <td>
                                ${escapeHTML(contact.message)}
                            </td>

                            <td>
                                ${new Date(
                        contact.createdAt
                    ).toLocaleString()}
                            </td>

                            <td>
                                ${replyStatus}
                            </td>

                            <td>

                                <button
                                    class="reply-btn"
                                    onclick='openReply(
                                        ${JSON.stringify(contact._id)},
                                        ${JSON.stringify(contact.email)}
                                    )'
                                >
                                    Reply
                                </button>

                                <button
                                    class="delete"
                                    onclick="deleteMessage('${contact._id}')"
                                >
                                    Delete
                                </button>

                            </td>

                        </tr>

                    `;

                });

            } catch (error) {

                console.error(error);

                document.getElementById(
                    "status"
                ).innerText =
                    "Not Connected to Server";

            }

        }


        // =========================
        // OPEN REPLY
        // =========================

        function openReply(contactId, email) {

            selectedContactId =
                contactId;


            document.getElementById(
                "replyEmail"
            ).value =
                email;


            document.getElementById(
                "replyText"
            ).value =
                "";


            document.getElementById(
                "replyStatus"
            ).innerText =
                "";


            document.getElementById(
                "sendReplyBtn"
            ).disabled =
                false;


            document.getElementById(
                "replyModal"
            ).style.display =
                "flex";

        }


        // =========================
        // CLOSE REPLY
        // =========================

        function closeReply() {

            selectedContactId =
                null;


            document.getElementById(
                "replyModal"
            ).style.display =
                "none";

        }


        // =========================
        // SEND REPLY
        // =========================

        async function sendReply() {

            const replyText =
                document.getElementById(
                    "replyText"
                ).value.trim();


            const replyStatus =
                document.getElementById(
                    "replyStatus"
                );


            const sendButton =
                document.getElementById(
                    "sendReplyBtn"
                );


            if (!selectedContactId) {

                replyStatus.innerText =
                    "Message not selected";

                replyStatus.style.color =
                    "red";

                return;
            }


            if (!replyText) {

                replyStatus.innerText =
                    "Please write a reply";

                replyStatus.style.color =
                    "red";

                return;
            }


            try {

                sendButton.disabled =
                    true;


                sendButton.innerText =
                    "Sending...";


                replyStatus.innerText =
                    "Sending reply...";

                replyStatus.style.color =
                    "#333";


                const response =
                    await fetch(
                        `${API}/reply`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`
                            },

                            body: JSON.stringify({

                                contactId:
                                    selectedContactId,

                                reply:
                                    replyText

                            })
                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "Reply response:",
                    data
                );


                if (
                    response.ok &&
                    data.success
                ) {

                    replyStatus.innerText =
                        "Reply sent successfully!";

                    replyStatus.style.color =
                        "green";


                    setTimeout(() => {

                        closeReply();

                        loadMessages();

                    }, 1000);

                } else {

                    replyStatus.innerText =
                        data.message ||
                        "Failed to send reply";

                    replyStatus.style.color =
                        "red";


                    sendButton.disabled =
                        false;

                    sendButton.innerText =
                        "Send Reply";
                }

            } catch (error) {

                console.error(
                    "Reply error:",
                    error
                );


                replyStatus.innerText =
                    "Server connection error";

                replyStatus.style.color =
                    "red";


                sendButton.disabled =
                    false;

                sendButton.innerText =
                    "Send Reply";
            }

        }


        // =========================
        // DELETE MESSAGE
        // =========================

        async function deleteMessage(id) {

            if (
                !confirm(
                    "You want to delete this message?"
                )
            ) {

                return;
            }


            try {

                const response =
                    await fetch(
                        `${API}/${id}`,
                        {
                            method: "DELETE",

                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                const data =
                    await response.json();


                if (data.success) {

                    alert(
                        "Message deleted successfully"
                    );

                    loadMessages();

                } else {

                    alert(
                        data.message
                    );

                }

            } catch (error) {

                console.error(error);

                alert(
                    "Message NOT DELETED"
                );

            }

        }


        // =========================
        // LOGOUT
        // =========================

        function logout() {

            localStorage.removeItem(
                "adminToken"
            );

            window.location.href =
                "AdminLogin.html";
        }


        // =========================
        // HTML SECURITY
        // =========================

        function escapeHTML(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value ?? "";

            return div.innerHTML;
        }


        // =========================
        // START
        // =========================

        loadMessages();

    </script>

</body>

</html>
