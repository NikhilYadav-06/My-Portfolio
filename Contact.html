<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me | Nikhil Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">
            NIKHIL
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="About.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="Contact.html">Contact</a></li>
            </ul>
        </nav>

    </header>


    <!-- ================= CONTACT SECTION ================= -->

    <section class="contact" id="contact">

        <h1>Contact Me</h1>

        <p class="contact-intro">
            Have a project or any questions? Feel free to contact me.
        </p>


        <div class="contact-container">


            <!-- ================= CONTACT INFO ================= -->

            <div class="contact-info">

                <h2>Get In Touch</h2>

                <p>
                    I would love to hear from you.
                    You can send me a message using the contact form.
                </p>


                <div class="contact-item">

                    <strong>Email:</strong>

                    <p>
                        your-email@gmail.com
                    </p>

                </div>


                <div class="contact-item">

                    <strong>Location:</strong>

                    <p>
                        Bhopal, Madhya Pradesh
                    </p>

                </div>

            </div>


            <!-- ================= CONTACT FORM ================= -->

            <div class="contact-form">

                <form id="contactForm">


                    <!-- NAME -->

                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- MESSAGE -->

                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            rows="6"
                            placeholder="Enter your message"
                            required
                        ></textarea>

                    </div>


                    <!-- SEND BUTTON -->

                    <button
                        type="submit"
                        class="btn"
                    >
                        Send Message
                    </button>


                    <!-- RESPONSE MESSAGE -->

                    <p id="responseMessage"></p>


                </form>

            </div>

        </div>

    </section>


    <!-- ================= JAVASCRIPT ================= -->

       <script>

const form = document.getElementById("contactForm");

form.addEventListener("submit", async function (e) {

    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const message = document.getElementById("message").value;

    const responseMessage = document.getElementById("responseMessage");

    responseMessage.innerText = "Sending...";

    try {

        const response = await fetch("https://my-portfolio-edwk.onrender.com/api/contact", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                email: email,
                message: message
            })
        });

        const data = await response.json();

        responseMessage.innerText = data.message;

        if (data.success) {
            form.reset();
        }

    } catch (error) {

        console.error(error);

        responseMessage.innerText =
            "Server se connection nahi ho raha ";
    }

});
</script>
    

</body>

</html>
